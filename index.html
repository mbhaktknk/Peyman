<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta name="color-scheme" content="light dark">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, user-scalable=yes">
<title>پیگیری قرارداد آبرسانی ۱۲۰۶</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0369a1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="پیمان">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#e9f2f9;--card:#fff;--ink:#0a2540;--mute:#587591;--line:#d3e3ef;--brand:#0369a1;--ob:#fff;--r:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#061325;--card:#0c2038;--ink:#e6f1fb;--mute:#88a5c2;--line:#173553;--brand:#38bdf8;--ob:#04243b}}
:root[data-theme=dark]{--bg:#061325;--card:#0c2038;--ink:#e6f1fb;--mute:#88a5c2;--line:#173553;--brand:#38bdf8;--ob:#04243b}
*{box-sizing:border-box;margin:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:"Segoe UI",Tahoma,"IRANSans X","IRANSans",Arial,sans-serif;font-weight:500;letter-spacing:-0.01em;background:radial-gradient(800px 380px at 85% -60px,color-mix(in srgb,var(--brand) 22%,transparent),transparent),radial-gradient(600px 300px at 0% 100%,color-mix(in srgb,var(--brand) 12%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 140px;position:relative;z-index:1}
.waves{position:fixed;left:0;right:0;bottom:0;height:150px;overflow:hidden;pointer-events:none;z-index:0}
.wave{position:absolute;bottom:0;left:-5%;width:110%;height:150px;fill:currentColor;stroke:none;color:var(--brand);opacity:.08;pointer-events:none;animation:drift 11s ease-in-out infinite alternate}
.wave.b{opacity:.06;animation-duration:15s;animation-direction:alternate-reverse;height:120px}
@keyframes drift{to{transform:translateX(3.5%)}}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:52px;height:52px;border-radius:14px;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(3,105,161,.25);overflow:hidden;border:1px solid color-mix(in srgb,var(--brand) 18%,transparent);flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo svg{width:24px;height:24px}
header h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.02em}
.who b,.tk h4,.hello b,.stat b{font-weight:700!important}
.chip,.btn,.tab,.bdg{font-weight:600}
.org{font-size:13px;font-weight:700;color:var(--ink);line-height:1.4}
.org2{font-size:11.5px;color:var(--mute);font-weight:500;margin-top:1px}
.ctag{display:inline-flex;align-items:center;gap:6px;margin-top:5px;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#contract{border:0;background:none;font:inherit;color:var(--mute);font-size:13px;width:100%;padding:2px 0;border-bottom:1px dashed transparent}
#contract:hover,#contract:focus{border-color:var(--line);outline:0}
.tools{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--mute)}
.ib:hover{background:var(--card);color:var(--ink)}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;right:14px;top:13px;color:var(--mute)}
.search input{width:100%;padding:12px 44px 12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;padding:2px 0 14px}
.chip{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mute)}
.chip b{margin-inline-start:auto;font-weight:500;font-size:12px;opacity:.8}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--brand);color:var(--ob);border-color:var(--brand)}
.sec{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-size:13px;font-weight:700}
.sec svg{width:17px;height:17px}
.sec span{color:var(--mute);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;line-height:1;flex:none;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:var(--mute);font-size:12.5px}
.q{display:flex;gap:4px}
.q a,.ra a{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.q svg,.ra svg{width:18px;height:18px}
.det{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.det>div{overflow:hidden;min-height:0}
.in{padding:4px 16px 14px;border-top:1px solid var(--line)}
.card.open .det{grid-template-rows:1fr}
.it{display:flex;gap:10px;padding:7px 0;font-size:13.5px;align-items:center}
.ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.ico svg{width:17px;height:17px}
.it em{font-style:normal;color:var(--mute);font-size:12px;display:block}
.it span{word-break:break-word}
.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}
.acts{display:flex;gap:8px;margin-top:6px}
.btn{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:9px 14px;border-radius:11px;font-size:13px;background:var(--bg)}
.btn.del{color:#dc2626}
.btn.pri{background:var(--brand);color:var(--ob)}
.btn:disabled{opacity:.4;pointer-events:none}
.empty{text-align:center;color:var(--mute);padding:50px 20px;font-size:14px}
.empty svg{width:44px;height:44px;margin-bottom:10px;opacity:.5}
.fab{position:fixed;left:18px;bottom:88px;display:flex;align-items:center;gap:8px;background:var(--brand);color:var(--ob);padding:14px 20px;border-radius:99px;font-weight:500;box-shadow:0 8px 24px rgba(3,105,161,.4);z-index:5}
dialog{border:0;border-radius:0;padding:0;width:100%;max-width:100%;height:100%;max-height:100%;margin:0;inset:0;background:var(--bg);color:var(--ink);overflow:auto;-webkit-overflow-scrolling:touch}
dialog::backdrop{background:rgba(2,10,24,.72)}
form{padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;min-height:auto;background:var(--card);box-sizing:border-box}
.dbox{padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;min-height:auto;background:var(--card);box-sizing:border-box}
@media(min-width:768px){
  dialog{width:min(560px,92vw);max-width:560px;height:auto;max-height:90vh;margin:auto;inset:auto;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:20px;background:var(--card);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  form,dialog .dbox{min-height:0;max-width:none;width:100%;margin:0;border-radius:20px;padding:22px 22px 24px}
  dialog.full{width:min(900px,94vw);max-width:900px;height:auto;max-height:92vh;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:16px}
  dialog.full .dbox{max-width:100%;margin:0;min-height:0}
}
form h2{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g label{font-size:12px;color:var(--mute);display:block}
.g .w{grid-column:1/-1}
.g input,.g select,.g textarea{width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.g input.l{direction:ltr;text-align:right}
.ft{display:flex;gap:8px;margin-top:16px}
.ft .btn{flex:1;justify-content:center;padding:12px}
.dbox h2{font-size:17px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.dr{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:flex-start}
.dr:first-of-type{border-top:0}
.dr .ico{width:42px;height:42px;border-radius:12px}
.dr .ico svg{width:21px;height:21px}
.dr div{flex:1}
.dr b{font-size:14.5px;font-weight:500}
.dr p{font-size:12.5px;color:var(--mute);line-height:1.8;margin:2px 0 10px}
.v{flex:1;min-width:0}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
[hidden]{display:none!important}
.ph{display:flex;align-items:center;gap:14px;padding-bottom:4px}
.ph .av{width:76px;height:76px;font-size:38px}
.pb{display:flex;gap:8px;flex-wrap:wrap}
.pl{font-size:12px;color:var(--mute)}
.stk{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sk{min-width:40px;height:40px;border-radius:12px;background:var(--bg);font-size:21px;padding:0 8px;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.sk:first-child{font-size:12px;font-family:inherit;color:var(--mute)}
.sk.on{box-shadow:0 0 0 2px var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.ra{display:flex;gap:6px}
button,.q a,.ra a,.chip,.fab{transition:transform .18s,background-color .2s,box-shadow .2s,color .2s}
button:active,.q a:active,.ra a:active{transform:scale(.93)}
.fab:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(3,105,161,.5)}
html.tx *,html.tx *::before{transition:background-color .4s ease,color .4s ease,border-color .4s ease!important}
dialog[open]{animation:dIn .32s cubic-bezier(.2,.8,.2,1)}
dialog[open]::backdrop{animation:bIn .32s ease}
dialog[open].out{animation:dOut .19s ease forwards}
dialog[open].out::backdrop{animation:bOut .19s ease forwards}
@keyframes dIn{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes dOut{to{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes bIn{from{opacity:0}}
@keyframes bOut{to{opacity:0}}
@keyframes pop{from{transform:rotate(-100deg) scale(.3);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.av.sm{width:38px;height:38px;font-size:19px;box-shadow:0 0 0 2px var(--c)}
.dh{font-size:12.5px;color:var(--mute);line-height:1.8;margin:6px 0;min-height:4px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px}
.dd{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);margin-bottom:8px}
.dd input{flex:1;min-width:0;font:inherit;font-size:28px;letter-spacing:2px;text-align:center;direction:ltr;background:none;border:0;color:var(--ink);padding:8px 4px}
.dd input:focus{outline:0}
.dm{min-height:72px;max-height:120px;overflow-y:auto}
.dmi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 8px;border-radius:12px;text-align:right}
.dmi:hover{background:var(--bg)}
.dmi b{display:block;font-weight:500;font-size:14px}
.dmi small{color:var(--mute);font-size:12px;direction:ltr;unicode-bidi:embed}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px auto;direction:ltr;max-width:380px}
.key{aspect-ratio:1.75;border-radius:999px;background:color-mix(in srgb,var(--bg) 92%,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;padding:0;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.key b{font-size:27px;font-weight:400;font-family:inherit}
.key small{font-size:10.5px;letter-spacing:1px;color:var(--mute);height:12px;display:flex;align-items:center}
.key small svg{width:17px;height:17px}
.key:active{background:color-mix(in srgb,var(--brand) 18%,var(--bg))}
.dacts{display:flex;gap:10px}
.dcall{flex:1;height:56px;border-radius:18px;background:#16a34a;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-decoration:none}
.dsms{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#2563eb;background:color-mix(in srgb,#2563eb 14%,transparent);text-decoration:none}
.off{opacity:.35;pointer-events:none}
.cen{display:block;width:100%;margin-top:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;direction:ltr;text-align:right}
.toast{position:fixed;bottom:150px;left:50%;transform:translate(-50%,18px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:14px;margin:10px 0}
.tab{flex:1;padding:9px 6px;border-radius:11px;font-size:13.5px;color:var(--mute)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.18)}
.fi{padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px;min-width:0}
.srow{display:flex;gap:6px;margin-top:8px}
.sc{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mute)}
.sc b{color:var(--ink);font-weight:500;font-size:13.5px}
.rc{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin:6px 0}
.rch{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--brand) 15%,transparent);border-radius:99px;padding:5px 11px;font-size:12.5px}
.rch button{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.rch svg{width:11px;height:11px}
.plist{max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin-top:8px}
.pr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}
.pr:last-child{border:0}
.pr input{width:18px;height:18px;accent-color:var(--brand);flex:none}
.pr small{color:var(--mute);direction:ltr;unicode-bidi:embed;display:block;text-align:right}
.tp{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tpc{padding:6px 12px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;display:flex;gap:6px;align-items:center}
.tpc.v{color:var(--brand);border-style:dashed}
.tpc .tx{color:#ef4444;font-size:15px;line-height:1}
.sbtns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.sbtns .btn{justify-content:center;padding:13px}
.qbar{height:6px;border-radius:9px;background:var(--bg);overflow:hidden;margin:8px 0 12px}
.qbar i{display:block;height:100%;background:var(--brand);transition:width .35s}
.bub{background:color-mix(in srgb,var(--brand) 13%,var(--bg));border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.9;white-space:pre-wrap;margin:10px 0;word-break:break-word}
.hi{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.hi small{display:block;color:var(--mute);font-size:11.5px;line-height:1.7}
.hi>small{white-space:nowrap}
.bub small{display:block;color:var(--mute);font-size:11.5px;margin-bottom:4px}
.rch button.rn{width:auto;height:auto;border-radius:0;background:none;display:inline;font-size:12.5px}
@keyframes vIn{from{opacity:0;transform:translateY(12px)}}
.view:not([hidden]){animation:vIn .35s cubic-bezier(.2,.8,.2,1)}
.nv{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nv button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11.5px;color:var(--mute);position:relative}
.nv svg{width:24px;height:24px;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.nv button.on{color:var(--brand);font-weight:700}
.nv button.on svg{transform:translateY(-2px) scale(1.1)}
.nv button.on::before{content:'';position:absolute;top:-7px;width:30px;height:3px;border-radius:0 0 5px 5px;background:var(--brand)}
.hello{margin:2px 4px 16px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.hello b{display:block;font-size:17px}
.hello small{color:var(--mute);font-size:12.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:right;position:relative;overflow:hidden;display:block;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.stat b{display:block;font-size:28px;line-height:1.2;font-weight:700;color:var(--c)}
.stat>span:last-child{font-size:12.5px;color:var(--mute);font-weight:500}
.stat .ico{position:absolute;left:12px;top:12px;opacity:.9}
.hd{margin:20px 4px 8px;font-size:14px;font-weight:700}
.tk{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--c);border-radius:16px;margin-bottom:9px;padding:12px 14px}
.t1{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.tk h4{font-size:14.5px;font-weight:500;margin:0;line-height:1.8}
.bdg{font-size:11.5px;padding:3px 10px;border-radius:99px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:500}
.mt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mute);margin:4px 0 8px;line-height:1.8}
.mt span{display:flex;align-items:center;gap:4px}
.mt svg{width:14px;height:14px}
.ac-status{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.ac-icons{display:flex;flex-wrap:nowrap;gap:4px;margin-top:8px;align-items:center;justify-content:flex-start}
.ac-icons .ib{flex:none}
.ac{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.ac .ib{width:34px;height:34px}
.ac .btn{padding:8px 13px}
.jp{display:flex;gap:6px;margin-top:4px}
.jp select{flex:1;min-width:0;margin-top:0!important}
dialog.full .dial{display:flex;flex-direction:column;height:100%}
dialog.full .dial>.dd{margin-top:auto}
dialog.full .dial>#dMt{flex:none}
dialog.full .dial>label.pl{margin-bottom:8px}
dialog.full .dial .keys{width:100%}
/* Jalali Calendar Popup */
.cal-pop{position:absolute;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:12px;width:min(300px,92vw);left:50%;transform:translateX(-50%)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-hd b{font-size:15px}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.cal-nav button:hover{background:var(--bg);color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid span{font-size:11px;color:var(--mute);padding:6px 0}
.cal-grid button{aspect-ratio:1;border-radius:10px;font-size:13.5px;display:grid;place-items:center}
.cal-grid button:hover{background:var(--bg)}
.cal-grid button.td{box-shadow:0 0 0 2px var(--brand)}
.cal-grid button.sel{background:var(--brand);color:var(--ob)}
.cal-grid button.out{opacity:.35}
.cal-ft{display:flex;gap:6px;margin-top:10px}
.cal-ft .btn{flex:1;justify-content:center;padding:9px}
/* Person picker */
.ppick{position:relative}
.ppick input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.ppick-list{position:absolute;top:100%;right:0;left:0;z-index:20;max-height:200px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ppick-list button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;text-align:right;font-size:13.5px}
.ppick-list button:hover{background:var(--bg)}
.ppick-list small{color:var(--mute);font-size:12px}
/* Reports */
.rfilt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.rfilt label{font-size:12px;color:var(--mute)}
.rfilt select,.rfilt input{width:100%;margin-top:4px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13.5px}
.rtbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.rtbl th,.rtbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.rtbl th{font-weight:500;color:var(--mute);font-size:12px;background:var(--bg)}
.rtbl tr:hover td{background:color-mix(in srgb,var(--brand) 6%,transparent)}
@media(max-width:480px){.g{grid-template-columns:1fr}.rfilt{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
@media print{
  body{background:#fff;color:#000}
  .nv,.fab,.tools,.waves,header .ib,#add,.rfilt,.srow,.search,.chips{display:none!important}
  .wrap{padding:12px;max-width:100%}
  .view[hidden]{display:none!important}
  .rhead{display:block!important}
  .tk,.stat,.card{break-inside:avoid;border-color:#ccc}
  .rtbl th{background:#eee!important}
  header{border-bottom:2px solid #0369a1;padding-bottom:10px;margin-bottom:16px}
}
/* ===== برنامه روزانه اکیپ‌ها ===== */
.plchips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 12px}
.plchips .chip{white-space:nowrap}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.pcard>b{display:block;font-size:14.5px;line-height:1.8;font-weight:700}
.pbar{height:9px;border-radius:99px;background:var(--bg);overflow:hidden;margin:10px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#16a34a);border-radius:99px;transition:width .4s}
.pmeta{font-size:12.5px;color:var(--mute)}
.pth{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:2px}
.pth h4{font-size:14.5px;font-weight:700;margin:0}
.pcnt{font-size:12px;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-weight:600;flex:none}
.pi{display:flex;align-items:flex-start;gap:12px;padding:10px 2px;border-top:1px dashed var(--line);cursor:pointer;font-size:14px;line-height:1.8}
.pi input{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--mute);background:var(--bg);flex:none;margin:0;cursor:pointer;display:grid;place-items:center;transition:background-color .2s,border-color .2s}
.pi input:checked{background:#16a34a;border-color:#16a34a}
.pi input:checked::after{content:'';width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.pi span{flex:1;min-width:0;word-break:break-word}
.pi.on span{color:var(--mute);text-decoration:line-through}
/* ===== دسکتاپ: چیدمان بهینه (فقط صفحه‌ی بزرگ؛ موبایل بدون تغییر) ===== */
@media screen and (min-width:1024px){
  .wrap{max-width:1080px;padding:24px 20px 130px}
  .nv{left:50%;right:auto;transform:translateX(-50%);width:min(620px,92vw);bottom:16px;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 34px rgba(3,40,80,.18);padding:6px 10px}
  .fab{left:max(20px,calc(50% - 540px));bottom:26px}
  .toast{bottom:96px}
  #vHome .stats{grid-template-columns:repeat(4,1fr)}
  .pgrid,#tList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .pgrid>.tk,#tList>.tk{margin:0}
  #tList>.empty{grid-column:1/-1}
  .pcard{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
  .pcard>b{flex:1 1 100%}
  .pcard .pbar{flex:1 1 320px;margin:8px 0}
  .pcard .pmeta{flex:none}
  .pcard .acts{flex:1 1 100%;margin-top:2px}
}
.pdup{display:block;font-size:11.5px;font-style:normal;margin-top:1px;color:#b45309;font-weight:600}
.pdup.ok{color:var(--mute);font-weight:400}
.pi.dup:not(.on){background:color-mix(in srgb,#f59e0b 9%,transparent);border-radius:10px}
.pwarn{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,#f59e0b 14%,transparent);border:1px solid color-mix(in srgb,#f59e0b 45%,transparent);font-size:12.5px;line-height:1.9}
.pwarn b{display:inline;font-size:13px;color:#b45309}
.pwarn ul{margin:4px 0 0;padding:0 18px 0 0}
.pgrp{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 12px}
.pgrp>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;cursor:pointer;font-size:13.5px;font-weight:600;list-style:none}
.pgrp>summary::-webkit-details-marker{display:none}
.pgrp>summary>span::before{content:'◂';color:var(--mute);margin-inline-end:8px;display:inline-block;transition:transform .2s}
.pgrp[open]>summary>span::before{transform:rotate(-90deg)}
.pgrp .pgrp{background:var(--bg);border-radius:12px}
.pgrp .plchips{padding-bottom:10px}

/* ===== چیدمان منظم فیلترها ===== */
#tChips{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:2px 0 12px;overflow:visible}
#tChips .chip{height:40px;padding:0 10px;min-width:0;white-space:nowrap}
.cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tChips .chip b{margin-inline-start:auto}
.chip b{min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);padding:0 6px;font-size:11.5px;font-weight:600;opacity:1;margin-inline-start:2px}
.chip.on .tyi{background:rgba(255,255,255,.22);color:#fff}
.plchips .chip{height:40px;align-items:center}
#tPri,#tSort{margin:6px 0}
.tab{display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.tab svg{width:15px;height:15px}
.tab b{font-weight:600;font-size:11.5px;opacity:.7}
.tab.on b{opacity:1}
.sl{flex:none;align-self:center;font-size:12px;color:var(--mute);padding:0 10px}
.pnx{display:inline-block;color:#f59e0b;margin-inline-end:4px;vertical-align:-3px}
.pnx svg{width:14px;height:14px;fill:#f59e0b}
.wi{display:inline-flex;color:#f59e0b;margin-inline-end:4px}.wi svg{width:14px;height:14px}
/* ===== انیمیشن‌های نرم ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes tick{0%{transform:scale(.55)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes fin{0%{box-shadow:0 0 0 0 rgba(22,163,74,.55)}100%{box-shadow:0 0 0 16px rgba(22,163,74,0)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%,100%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
@keyframes fabIn{from{opacity:0;transform:scale(.4) translateY(20px)}}
@keyframes navPop{0%{transform:translateY(0) scale(.8)}55%{transform:translateY(-5px) scale(1.25)}100%{transform:translateY(-2px) scale(1.1)}}
.enter>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.tk,.stat,.pcard,.rc,.pgrp{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
@media(hover:hover){.tk:hover,.stat:hover,.rc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(3,40,80,.13)}}
.btn:active,.chip:active,.tab:active,.ib:active,.stat:active,.acc-h:active,.dlc:active{transform:scale(.95)}
.ib,.btn,.tab,.acc-h,.dlc{transition:transform .15s,background-color .2s,color .2s}
.pi input.pop{animation:tick .45s cubic-bezier(.3,1.6,.5,1)}
.pi span{transition:color .3s}
.tk.fin{animation:fin .7s ease-out}
.bdg.pulse{animation:pulse 1.9s infinite}
.fab{animation:fabIn .6s cubic-bezier(.2,1.4,.4,1) .25s backwards}
.nv button.on svg{animation:navPop .5s cubic-bezier(.3,1.6,.5,1)}
@media screen and (min-width:1024px){#tList>.tk.acc.open{grid-column:1/-1}}

/* ===== برنامه روز: نوار هفتگی ===== */
.wkh2{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 8px;font-size:12.5px;color:var(--mute);font-weight:600}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:12px}
.pgrp .wstrip{margin:2px 0 12px}
.dc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 9px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-width:0;overflow:hidden}
.dc .dn{font-size:clamp(9px,2.5vw,11.5px);color:var(--mute);font-weight:600;white-space:nowrap}
.dc .dnum{font-size:clamp(15px,4.4vw,19px);line-height:1.25;font-weight:700}
.dc .dmon{font-size:9.5px;color:var(--mute)}
.dc .dct{font-size:9.5px;color:var(--mute);margin-top:2px;white-space:nowrap}
.dc .dbar{display:block;width:70%;height:4px;border-radius:4px;background:color-mix(in srgb,var(--mute) 22%,transparent);margin-top:4px;overflow:hidden}
.dc .dbar u{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .4s}
.dc.ok .dbar u{background:#16a34a}.dc.ok .dnum{color:#16a34a}
.dc.td{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.dc.emp{opacity:.5;border-style:dashed;background:transparent}
.dc.emp:hover{opacity:.95}
.dc.on{background:var(--brand);color:var(--ob);border-color:var(--brand)}
.dc.on .dn,.dc.on .dmon,.dc.on .dct{color:inherit;opacity:.92}
.dc.on .dnum,.dc.on.ok .dnum{color:inherit}
.dc.on .dbar{background:rgba(255,255,255,.3)}.dc.on .dbar u{background:#fff}
.dc .dw{position:absolute;top:3px;left:3px;color:#f59e0b;display:flex}.dc .dw svg{width:11px;height:11px}
.dc.on .dw{color:#fde68a}
/* ===== خانه: لیست آکاردئونی ===== */
.hl{display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.hl>.tk{margin:0}
@media screen and (min-width:1024px){.hl{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:12px}.hl>.tk.acc.open{grid-column:1/-1}}
/* ===== منوی نوع کار: جمع‌شونده ===== */
.tyacc{margin:6px 0 4px}
.tyh{display:flex;align-items:center;gap:8px;width:100%;height:46px;padding:0 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
.tyh .tyl{color:var(--mute);font-size:12px}
.tyh .tyv{font-weight:700;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tyh .tyc{min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-size:11.5px;font-weight:600;padding:0 7px}
.tyh .tych{color:var(--mute);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.tyacc.open .tych{transform:rotate(180deg)}
.tyb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.tyacc.open .tyb{grid-template-rows:1fr}
.tyin{overflow:hidden;min-height:0}
.tyin .chips{padding-top:8px}

/* ===== مرکز گزارش ===== */
.rhub{margin:0 0 12px}
.rhub-b{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;text-align:right;transition:transform .2s,border-color .2s,box-shadow .2s}
.rhub-b:hover{transform:translateY(-2px);border-color:var(--brand);box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 18%,transparent)}
.rhub-b:active{transform:scale(.97)}
.rhub-b .rhi{flex:none;width:44px;height:44px;padding:9px;border-radius:14px;background:linear-gradient(135deg,var(--b1,#0369a1),var(--b2,#14a3b5));color:#fff;box-sizing:border-box}
.rhub-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.rhub-t b{font-size:14px;font-weight:800}
.rhub-t small{font-size:11px;color:var(--mute)}
.rhi{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rh-l1,.rh-l2,.rh-l3{transform-box:fill-box;transform-origin:100% 50%;animation:rhGrow 1.6s ease-in-out infinite}
.rh-l2{animation-delay:.25s}.rh-l3{animation-delay:.5s}
.rh-dot{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center;animation:rhPulse 1.2s ease-in-out infinite}
.rhub-b:hover .rhi{animation:rhBob .8s ease-in-out infinite}
@keyframes rhGrow{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
@keyframes rhPulse{50%{transform:scale(1.5)}}
@keyframes rhBob{50%{transform:translateY(-2px)}}
.hubbox{display:block;width:100%;max-width:560px;margin:0 auto;padding:14px;background:var(--card);color:var(--text);box-sizing:border-box}
.hub-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hub-ic{flex:none;width:44px;height:44px;border-radius:14px;padding:9px;background:linear-gradient(135deg,var(--b1,#0369a1),var(--b2,#14a3b5));color:#fff;box-sizing:border-box}
.hub-ic .rhi{width:26px;height:26px}
.hub-ht{flex:1;min-width:0;display:flex;flex-direction:column}
.hub-ht b{font-size:14px}.hub-ht small{font-size:11px;color:var(--mute)}
.hub-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:10px}
.hub-modes button{padding:8px 4px;border:0;border-radius:11px;background:transparent;color:var(--mute);font-weight:700;font-size:12.5px;cursor:pointer;transition:background .25s,color .25s,transform .2s}
.hub-modes button.on{background:linear-gradient(135deg,var(--b1,#0369a1),var(--b2,#14a3b5));color:#fff}
.hub-modes button:active{transform:scale(.96)}
.hub-tools{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.hub-tools .btn{font-size:12px;padding:6px 10px}
.hub-tools span{margin-inline-start:auto;font-size:12px;color:var(--mute);font-weight:700}
.hub-list{max-height:52vh;overflow:auto;display:grid;gap:6px;padding:2px}
.hub-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.hub-row:hover{transform:translateX(-2px);border-color:var(--brand)}
.hub-row.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--card))}
.hub-row input{flex:none;width:18px;height:18px;accent-color:var(--brand);margin:0}
.hub-l{flex:1;min-width:0;display:flex;flex-direction:column}
.hub-l b{font-size:13px;font-weight:700}.hub-l small{font-size:11px;color:var(--mute)}
.hub-go{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px}
/* ===== کارت برنامه: دکمه‌ها در شبکه‌ی مرتب ===== */
#vPlan .placts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#vPlan .placts .btn{width:100%;justify-content:center;min-width:0;white-space:nowrap;font-size:12.5px;padding:8px 6px}
/* ===== گزارش: فشرده‌تر ===== */
#vRep .rfilt{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
#vRep .rfilt label{font-size:11.5px;color:var(--mute)}
#vRep .rfilt label.w{grid-column:1/-1}
#vRep .rfilt select,#vRep .rfilt .wsbox input{padding:7px 10px;font-size:12.5px;min-height:0;height:auto}
#vRep .srow .btn{padding:8px 6px;font-size:12px}
#vRep #rSum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#vRep #rSum .stat{padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center}
#vRep #rSum .stat b{font-size:16px;line-height:1.2}
#vRep #rSum .stat span{font-size:10.5px}
/* ===== آکاردئون نوع کار ===== */
.tyacc2{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:6px 0 10px;overflow:hidden}
.tyacc2>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-weight:700;font-size:13px;user-select:none}
.tyacc2>summary::-webkit-details-marker{display:none}
.tyacc2>summary small{font-size:11px;color:var(--mute);font-weight:600}
.tyacc2>summary span::before{content:'◂';color:var(--mute);margin-inline-end:6px;display:inline-block;transition:transform .25s}
.tyacc2[open]>summary span::before{transform:rotate(-90deg)}
.tyacc2-b{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px 10px}
.chip2{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;cursor:pointer;transition:transform .2s,border-color .2s,background .2s}
.chip2 b{font-weight:700;font-size:11px;color:var(--mute)}
.chip2 .tyi{width:20px;height:20px;border-radius:7px}
.chip2.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--card));font-weight:700}
.chip2:hover{transform:translateY(-1px);border-color:var(--brand)}
.chip2:active{transform:scale(.95)}
/* ===== جست‌وجوی مسئول ===== */
.wsbox{position:relative;display:block}
.wsbox input{width:100%;box-sizing:border-box}
.wslist{position:absolute;inset-inline:0;top:100%;margin-top:4px;max-height:220px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(3,40,80,.18);z-index:30;display:block}
.wslist[hidden]{display:none}
.wsi{display:block;width:100%;text-align:right;padding:9px 12px;font-size:13px;background:none;border:0;color:var(--text);cursor:pointer;font-family:inherit}
.wsi:hover{background:var(--bg)}
.wsi.on{color:var(--brand);font-weight:700}
.wsn{display:block;padding:10px 12px;font-size:12px;color:var(--mute)}

/* ===== انتقال تم: محو نرم ===== */
html.tfade body{animation:tfadeK .4s ease}
@keyframes tfadeK{from{opacity:.55}to{opacity:1}}
@media (prefers-reduced-motion: reduce){html.tfade body{animation:none}}

/* =====================================================================
   ظاهر و استایل «سامانه PM» روی سامانه پیمان
   (فقط لایه‌ی ظاهری؛ همه‌ی قابلیت‌ها و داده‌ها بدون تغییر)
   ===================================================================== */
:root,:root[data-theme=light]{--bg:#e9f0f5;--card:#fff;--ink:#10263a;--mute:#5b7186;--line:#d3e0ea;--brand:#0b6fa4;--ob:#fff;--b1:#0b6fa4;--b2:#14a3b5;--sh:0 6px 24px #0b2a4a1a}
:root[data-theme=dark]{--bg:#0c141d;--card:#142030;--ink:#e4ecf3;--mute:#9fb3c6;--line:#26394f;--brand:#5cc3ef;--ob:#fff;--b1:#0b78b0;--b2:#16a9bd;--sh:0 6px 24px #0007}
body{background:var(--bg);color:var(--ink);transition:background .35s,color .35s}
.waves{display:none}
/* ---- هدر ---- */
header.top{position:relative;display:block;margin:0;overflow:hidden;background:linear-gradient(120deg,#0a5f90,#0b8fb0 60%,#18b0b8);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 34px}
header.top::before{content:"";position:absolute;inset:-40% -10% auto auto;width:360px;height:360px;border-radius:50%;background:radial-gradient(#ffffff26,#fff0 70%);animation:floatC 9s ease-in-out infinite;pointer-events:none}
@keyframes floatC{50%{transform:translate(-40px,30px) scale(1.1)}}

/** ارسال پیامک سازگار با اندروید / APK / WebView */
function openSms(nums, body){
  const list=[].concat(nums||[]).map(digits).filter(n=>n&&n.replace(/\D/g,'').length>=5);
  if(!list.length){toast('شماره معتبری یافت نشد');return false}
  const cleaned=list.map(n=>{
    let x=String(n).replace(/[^\d+]/g,'');
    if(x.startsWith('00'))x='+'+x.slice(2);
    if(x.startsWith('+98'))x='0'+x.slice(3);
    if(x.startsWith('98')&&x.length>=12)x='0'+x.slice(2);
    return x;
  });
  const text=body||'';
  const numsStr=cleaned.join(',');
  const url='smsto:'+numsStr+(text?('?body='+encodeURIComponent(text)):'');
  // لینک واقعی + کلیک کاربرگونه‌ای
  const a=document.createElement('a');
  a.href=url;
  a.style.cssText='position:fixed;left:-9999px';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){try{a.remove()}catch(e){}},500);
  return true;
}
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>toISO(new Date());
const dd=iso=>{const a=new Date(iso+'T12:00:00'),b=new Date(today()+'T12:00:00');return Math.round((a-b)/864e5)};
const addD=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return toISO(d)};

/* Jalali helpers */
const div=(a,b)=>~~(a/b);
function g2j(gy,gm,gd){const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];let jy;if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
  const g2=gm>2?gy+1:gy;let days=365*gy+div(g2+3,4)-div(g2+99,100)+div(g2+399,400)-80+gd+gdm[gm-1];
  jy+=33*div(days,12053);days%=12053;jy+=4*div(days,1461);days%=1461;
  if(days>365){jy+=div(days-1,365);days=(days-1)%365}
  const jm=days<186?1+div(days,31):7+div(days-186,30),jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){let gy;if(jy>979){gy=1600;jy-=979}else gy=621;
  let days=365*jy+div(jy,33)*8+div((jy%33)+3,4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  gy+=400*div(days,146097);days%=146097;
  if(days>36524){gy+=100*div(--days,36524);days%=36524;if(days>=365)days++}
  gy+=4*div(days,1461);days%=1461;
  if(days>365){gy+=div(days-1,365);days=(days-1)%365}
  let gd=days+1;const sal=[0,31,((gy%4==0&&gy%100!=0)||gy%400==0)?29:28,31,30,31,30,31,31,30,31,30,31];let gm;
  for(gm=0;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];return[gy,gm,gd]}
const MON=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const iso2j=iso=>g2j(+iso.slice(0,4),+iso.slice(5,7),+iso.slice(8,10));
const jf=iso=>{if(!iso)return '—';const[y,m,d]=iso2j(iso);return fa(d)+' '+MON[m-1]+' '+fa(y)};
function jDaysInMonth(jy,jm){if(jm<=6)return 31;if(jm<=11)return 30;const a=(jy%33);return [1,5,9,13,17,22,26,30].includes(a)?30:29}

/* Theme */
const TK='pb_theme';
function setTheme(t,anim){
  const h=document.documentElement;
  h.dataset.theme=t;h.style.colorScheme=t==='dark'?'dark':'light';
  try{localStorage.setItem(TK,t)}catch(e){}
  $('bTh').innerHTML=ic('sun').replace('<svg','<svg class="sun"')+ic('moon').replace('<svg','<svg class="moon"');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(anim&&!reduce){
    /* محو نرم و کوتاه بدون بازبارگذاری صفحه */
    h.classList.remove('tfade');void h.offsetWidth;h.classList.add('tfade');
    clearTimeout(setTheme._t);setTheme._t=setTimeout(()=>h.classList.remove('tfade'),400);
  }
}
let th=null;try{th=localStorage.getItem(TK)}catch(e){}
setTheme(th||'dark');
try{$('dchip').textContent=new Date().toLocaleDateString('fa-IR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(e){}

/* Navigation */
let cur='home',TF={st:'open',ty:'all',pr:'all',so:'due'};

function go(v,st){
  cur=v;if(st)TF.st=st;
  Object.entries(VW).forEach(([k,[id]])=>$(id).hidden=k!==v);
  $('nv').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));

  ENTER=true;try{VW[v][1]()}finally{ENTER=false}window.scrollTo({top:0});
}

});

/* ========== JALALI CALENDAR PICKER ========== */
function makeCal(containerId, isoVal, onChange){
  const box=$(containerId);
  box.innerHTML=`<button type="button" class="fi" style="width:100%;text-align:right;cursor:pointer" id="${containerId}_btn">${isoVal?jf(isoVal):'انتخاب تاریخ'}</button><div class="cal-pop" id="${containerId}_pop" hidden></div>`;
  const btn=$(containerId+'_btn'),pop=$(containerId+'_pop');
  let curIso=isoVal||'';
  let [jy,jm]=iso2j(curIso||today());

  function draw(){
    const dim=jDaysInMonth(jy,jm);
    const firstG=j2g(jy,jm,1);
    const firstDow=(new Date(firstG[0],firstG[1]-1,firstG[2]).getDay()+1)%7; // Sat=0
    const todayJ=iso2j(today());
    let html=`<div class="cal-hd"><div class="cal-nav"><button type="button" data-a="-y">${ic('chevR')}</button><button type="button" data-a="-m">${ic('chevR')}</button></div>
    <b>${MON[jm-1]} ${fa(jy)}</b>
    <div class="cal-nav"><button type="button" data-a="+m">${ic('chevL')}</button><button type="button" data-a="+y">${ic('chevL')}</button></div></div>
    <div class="cal-grid"><span>ش</span><span>ی</span><span>د</span><span>س</span><span>چ</span><span>پ</span><span>ج</span>`;
    for(let i=0;i<firstDow;i++)html+=`<button type="button" class="out" disabled></button>`;
    for(let d=1;d<=dim;d++){
      const iso=(()=>{const[g,m,dd]=j2g(jy,jm,d);return g+'-'+pad(m)+'-'+pad(dd)})();
      const isTd=todayJ[0]===jy&&todayJ[1]===jm&&todayJ[2]===d;
      const isSel=curIso===iso;
      html+=`<button type="button" data-iso="${iso}" class="${isTd?'td':''} ${isSel?'sel':''}">${fa(d)}</button>`;
    }
    html+=`</div><div class="cal-ft"><button type="button" class="btn" data-a="today">امروز</button><button type="button" class="btn" data-a="clear">پاک</button></div>`;
    pop.innerHTML=html;
    pop.querySelectorAll('[data-a]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      const a=b.dataset.a;
      if(a==='-m'){jm--;if(jm<1){jm=12;jy--}}
      else if(a==='+m'){jm++;if(jm>12){jm=1;jy++}}
      else if(a==='-y')jy--;
      else if(a==='+y')jy++;
      else if(a==='today'){curIso=today();[jy,jm]=iso2j(curIso);btn.textContent=jf(curIso);pop.hidden=true;onChange&&onChange(curIso);return}
      else if(a==='clear'){curIso='';btn.textContent='انتخاب تاریخ';pop.hidden=true;onChange&&onChange('');return}
      draw();
    });
    pop.querySelectorAll('[data-iso]').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      curIso=b.dataset.iso;
      btn.textContent=jf(curIso);
      pop.hidden=true;
      onChange&&onChange(curIso);
    });
  }
  btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.cal-pop').forEach(p=>{if(p!==pop)p.hidden=true});pop.hidden=!pop.hidden;if(!pop.hidden)draw()};
  document.addEventListener('click',()=>pop.hidden=true);
  return {get:()=>curIso,set:v=>{curIso=v||'';btn.textContent=v?jf(v):'انتخاب تاریخ'}};
}

/* ========== PERSON SEARCH PICKER ========== */
function personPicker(containerId, selectedId, onChange){
  const box=$(containerId);
  const sel=S.list.find(p=>p.id===selectedId);
  box.innerHTML=`<div class="ppick"><input type="text" id="${containerId}_in" placeholder="جستجوی نام یا سمت…" value="${sel?esc(sel.name):''}" autocomplete="off"><input type="hidden" id="${containerId}_val" value="${selectedId||''}"><div class="ppick-list" id="${containerId}_list" hidden></div></div>`;
  const inp=$(containerId+'_in'),val=$(containerId+'_val'),list=$(containerId+'_list');
  function show(q){
    const nq=norm(q);
    const L=S.list.filter(p=>!nq||norm(p.name+' '+ (p.pos||'')).includes(nq)).slice(0,12);
    list.innerHTML=L.length?L.map(p=>`<button type="button" data-id="${p.id}"><span class="av sm" style="--c:${(CATS[p.cat]||CATS.oth).c}">${stk(p)}</span><span><b style="font-weight:500">${esc(p.name)}</b>${p.pos?` <small style="color:var(--mute)">${esc(p.pos)}</small>`:''}</span></button>`).join('')+'<button type="button" data-id="" style="color:var(--mute)">— بدون مسئول —</button>':'<div class="dh" style="padding:12px;text-align:center">موردی پیدا نشد</div>';

  document.addEventListener('click',e=>{if(!box.contains(e.target))list.hidden=true});
  return {get:()=>val.value,set:id=>{val.value=id||'';const p=S.list.find(x=>x.id===id);inp.value=p?p.name:''}};
}

function stk(p){if(p.emoji)return p.emoji;const t=norm(p.pos).replace(/ي/g,'ی').replace(/ك/g,'ک');for(const[re,e]of KW)if(re.test(t))return e;return DEF[p.cat]||'👤'}

function readImg(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const z=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=Math.min(320,z);c.getContext('2d').drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)})}
function pick(p){const c=p.emoji||'';return `<div class="w"><span class="pl">استیکر نمایه (پیش‌فرض: خودکار بر اساس سمت)</span><input type="hidden" name="emoji" value="${c}"><div class="stk">${['',...STK].map(e=>`<button type="button" class="sk ${e===c?'on':''}" data-e="${e}">${e||'خودکار'}</button>`).join('')}</div></div>`}

/* ===== توضیحات خط‌به‌خط ===== */
function descSplit(x){
  const out=[];
  String(x||'').replace(/\r/g,'').replace(/-{2,}/g,' -- ').split('\n').forEach(line=>{
    line.split(/(https?:\/\/\S+)/).forEach((part,i)=>{
      if(i%2){const u=part.replace(/[.,;،)\]]+$/,'');if(u)out.push(u);return}
      part.split(/\s*-{2}\s*|\s*[؛;]\s*|(?<=[.!؟?])\s+/).forEach(t=>{
        t=t.replace(/^[\s\-–—•*·●▪]+/,'').trim();
        if(t&&/[\p{L}\p{N}]/u.test(t))out.push(t);
      });
    });
  });
  return out;
}
function shortUrl(u){try{const a=new URL(u),q=a.pathname.replace(/\/$/,'').split('/').filter(Boolean);return a.host.replace(/^www\./,'')+(q.length>1?'/…/'+q[q.length-1]:q.length?'/'+q[0]:'')}catch(_){return u.length>34?u.slice(0,30)+'…':u}}
function descHtml(x,plain){
  const L=descSplit(x);if(!L.length)return '';
  return '<ul class="dl">'+L.map(t=>/^https?:\/\//.test(t)?`<li class="dlk"><a href="${esc(t)}" target="_blank" rel="noopener" dir="ltr">${ic('link')}${esc(shortUrl(t))}</a>${plain?'':`<button type="button" class="dlc" data-copy="${esc(t)}" title="کپی لینک">${ic('copy')}</button>`}</li>`:`<li>${esc(t)}</li>`).join('')+'</ul>';
}

const tyi=(v,sz)=>`<span class="tyi ${sz||''}" data-i="${v.i||'dots'}" style="--c:${v.c}">${ic(v.i||'dots')}</span>`;
function fx(el){
  if(!el)return;
  el.classList.remove('enter');
  if(!ENTER)return;
  [...el.children].forEach((c,i)=>c.style.setProperty('--i',Math.min(i,14)));

function countUp(root){
  root.querySelectorAll('.stat b[data-n]').forEach(b=>{
    const n=+b.dataset.n;if(!n)return;const t0=performance.now();
    (function f(t){const k=Math.min(1,(t-t0)/800),e=1-Math.pow(1-k,3);b.textContent=fa(Math.round(n*e));if(k<1)requestAnimationFrame(f)})(t0);
  });
}
function copyText(x,msg){
  const ok=()=>toast(msg||'کپی شد');
  function fb(){const a=document.createElement('textarea');a.value=x;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();let r=false;try{r=document.execCommand('copy')}catch(_){}a.remove();r?ok():prompt('متن را کپی کنید:',x)}

function tcardAcc(t){

const RHICON='<svg class="rhi" viewBox="0 0 24 24" aria-hidden="true"><rect class="rh-doc" x="4" y="2.5" width="16" height="19" rx="3"/><path class="rh-l1" d="M8 8h8"/><path class="rh-l2" d="M8 12h8"/><path class="rh-l3" d="M8 16h5"/><circle class="rh-dot" cx="17" cy="17" r="2.2"/></svg>';
const RHUB_HTML=`<div class="rhub"><button type="button" class="rhub-b" id="rHub">${RHICON}<span class="rhub-t"><b>مرکز گزارش برنامه روزانه</b><small>روزانه · هفتگی · ماهانه · چند مورد دلخواه</small></span></button></div>`;
function planHubDlg(){
  const all=(S.plans||[]).slice().sort((a,b)=>a.iso.localeCompare(b.iso));
  if(!all.length){toast('هنوز برنامه‌ای ثبت نشده');return}
  const sel=new Set();let mode='day',groups=[];
  const box=document.createElement('dialog');box.className='full';
  box.innerHTML=`<div class="dbox hubbox"><div class="hub-h"><div class="hub-ic">${RHICON}</div><div class="hub-ht"><b>مرکز گزارش برنامه روزانه</b><small>دوره را انتخاب کنید و هر چند مورد که خواستید تیک بزنید</small></div><button type="button" class="ib" id="hX" aria-label="بستن">✕</button></div>
    <div class="hub-modes"><button type="button" data-m="day">روزانه</button><button type="button" data-m="week">هفتگی</button><button type="button" data-m="month">ماهانه</button></div>
    <div class="hub-tools"><button type="button" class="btn" id="hAll">انتخاب همه</button><button type="button" class="btn" id="hNone">پاک کردن</button><span id="hCnt"></span></div>
    <div id="hList" class="hub-list"></div>
    <button type="button" class="btn pri hub-go" id="hGo">${ic('sheet')}ساخت گزارش</button></div>`;
  document.body.appendChild(box);
  const close=()=>{try{box.close()}catch(e){}box.remove()};
  function build(){
    if(mode==='day')groups=all.map(p=>({label:plLabel(p),ids:[p.id]}));
    else if(mode==='week'){const m={};all.forEach(p=>{const k=pWs(p.iso);(m[k]=m[k]||[]).push(p.id)});groups=Object.keys(m).sort().reverse().map(k=>({label:pWeekLbl(k),ids:m[k]}))}
    else{const m={};all.forEach(p=>{const j=iso2j(p.iso),k=j[0]+'-'+pad(j[1]);(m[k]=m[k]||{label:MON[j[1]-1]+' ماه '+fa(j[0]),ids:[]}).ids.push(p.id)});groups=Object.keys(m).sort().reverse().map(k=>({label:m[k].label,ids:m[k].ids}))}
  }
  function paint(){
    box.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
    const list=box.querySelector('#hList');
    list.innerHTML=groups.map((g,i)=>{
      const ps=all.filter(p=>g.ids.includes(p.id));let d=0,t=0;ps.forEach(p=>{const r=pc(p);d+=r[0];t+=r[1]});
      const on=g.ids.every(id=>sel.has(id)),part=!on&&g.ids.some(id=>sel.has(id));
      return `<label class="hub-row${on?' on':''}"><input type="checkbox" data-g="${i}"${on?' checked':''} data-part="${part?1:0}"><span class="hub-l"><b>${esc(g.label)}</b><small>${fa(ps.length)} روز برنامه · ${fa(d)} از ${fa(t)} کار</small></span></label>`;
    }).join('');
    list.querySelectorAll('[data-g]').forEach(c=>{
      const g=groups[+c.dataset.g];c.indeterminate=c.dataset.part==='1';
      c.onchange=()=>{if(c.checked)g.ids.forEach(id=>sel.add(id));else g.ids.forEach(id=>sel.delete(id));paint()};
    });
    box.querySelector('#hCnt').textContent=fa(sel.size)+' روز انتخاب شده';
  }
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;build();paint()});
  box.querySelector('#hAll').onclick=()=>{groups.forEach(g=>g.ids.forEach(id=>sel.add(id)));paint()};
  box.querySelector('#hNone').onclick=()=>{sel.clear();paint()};
  box.querySelector('#hX').onclick=close;
  box.querySelector('#hGo').onclick=()=>{
    const list=all.filter(p=>sel.has(p.id));
    if(!list.length){toast('حداقل یک مورد را انتخاب کنید');return}
    close();
    const dur={day:'روزهای انتخابی',week:'هفته‌های انتخابی',month:'ماه‌های انتخابی'}[mode];
    planReportDlg(list,'گزارش برنامه روزانه',dur+' · '+fa(list.length)+' روز');
  };
  build();paint();
  try{box.showModal()}catch(e){box.setAttribute('open','')}
}

function doReport(){
  if(!rfFromC||!rfToC){try{rfFromC=makeCal('rfFrom','');rfToC=makeCal('rfTo','')}catch(_){}}

  if(ty&&ty!=='all')L=L.filter(t=>t.type===ty);

  if(st==='open')L=L.filter(t=>t.status!=='done');
  else if(st==='done')L=L.filter(t=>t.status==='done');
  else if(st==='over')L=L.filter(t=>t.status!=='done'&&t.due&&dd(t.due)<0);

  const open=L.filter(t=>t.status!=='done').length;
  const done=L.filter(t=>t.status==='done').length;

  const byType={};

  const rangeTxt=[from?jf(from):'',to?jf(to):''].filter(Boolean).join(' تا ')||'همه تاریخ‌ها';

function parseCSV(t){const r=[];let row=[],c='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}

function makeVCF(){
  const e=x=>String(x||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  return S.list.map(p=>{
    const n=[p.note,p.ext?'داخلی: '+p.ext:'',p.nid?'کد ملی: '+p.nid:'',p.car?'خودرو: '+p.car+(p.plate?' — پلاک '+p.plate:''):''].filter(Boolean).join('\n');
    const L=['BEGIN:VCARD','VERSION:3.0','FN:'+e(p.name),'N:;'+e(p.name)+';;;'];
    if(p.company)L.push('ORG:'+e(p.company));
    if(p.pos)L.push('TITLE:'+e(p.pos));
    if(p.mobile)L.push('TEL;TYPE=CELL:'+p.mobile);
    if(p.tel)L.push('TEL;TYPE=WORK,VOICE:'+p.tel);
    if(p.email)L.push('EMAIL;TYPE=WORK:'+p.email);
    if(n)L.push('NOTE:'+e(n));
    L.push('CATEGORIES:'+e(CATS[p.cat]?.n||''));
    if(p.photo&&p.photo.includes(','))L.push(('PHOTO;ENCODING=b;TYPE=JPEG:'+p.photo.split(',')[1]).replace(/(.{74})(?=.)/g,'$1\r\n '));
    L.push('END:VCARD');
    return L.join('\r\n');
  }).join('\r\n')+'\r\n';

/* ========== برنامه روزانه اکیپ‌ها ========== */
const PL={sel:null,open:{}};
const WDR=/(یکشنبه|دوشنبه|سه\s?شنبه|چهارشنبه|پنج\s?شنبه|پنجشنبه|جمعه|شنبه)/;
const pc=p=>{let t=0,d=0;p.teams.forEach(x=>x.items.forEach(i=>{t++;if(i.d)d++}));return[d,t]};
const plLabel=p=>(p.wd?p.wd+' ':'')+(p.iso?jf(p.iso):(p.title||'برنامه'));
const PL_VERB=new Set('بررسی بازدید نگهداشت نصب تحویل سرویس رفع شارژ ادامه تعویض تعمیر بستن باز جمع تست اجرا پیگیری هماهنگی همکاری کالیبره لایروبی شستشو رسوب تخلیه مانور اندازه تهیه تامین تأمین حمل جابجایی اتصال قطع وصل راه پیاده برداشت تمیز رنگ جوش خرید ارسال دریافت تکمیل انجام اصلاح ساخت تنظیم برقراری پایش نظارت بازرسی ثبت سرکشی گشت نمونه آماده'.split(' '));
const PL_NOUN=new Set('فشارشکن فشارشکن‌ها چاه چاه‌ها پمپ شیرآلات شیر خط مخزن ایستگاه تابلو حوضچه دریچه منبع فلومتر ترانس'.split(' '));
const PL_STOP=/^(کار|کارها|کارهای|ادامه|سایر|متفرقه)$/;
function splitPlanTasks(x){
  return String(x||'').split(/\s+[-–—]\s*|\s*[-–—]\s+|\s*[-–—]\s*$/)
    .map(s=>s.replace(/^\d{1,2}\s*[.)]\s+/,'').replace(/[\s\-–—،,؛;.]+$/,'').replace(/\s{2,}/g,' ').trim())
    .filter(s=>/[\p{L}\p{N}]/u.test(s));
}
function planHead(seg){
  const w=seg.split(/\s+/);if(!PL_VERB.has(w[0]))return '';
  const k=w.findIndex(x=>PL_NOUN.has(x));return k>0?w.slice(0,k+1).join(' '):'';
}
/* هر بخش جداشده را به «کار مستقل» تبدیل می‌کند: شماره‌های پشت‌سرهم و نام‌های کوتاه، عبارت کار قبلی را به ارث می‌برند */
function planItems(segs){
  const out=[];let base='',head='';
  const full=t=>{out.push(t);base=t;head=planHead(t)};
  segs.forEach(sg=>{
    sg=sg.trim();if(!sg)return;
    const m=!/\d{4}/.test(sg)&&sg.match(/(?<!\d)\d{1,3}(?:[-–]\d{1,3})+(?!\d)/);
    if(m){
      const pre=sg.slice(0,m.index).replace(/چاه[\s\u200c]*(های|ها)\s*$/,'چاه '),post=sg.slice(m.index+m[0].length);
      m[0].split(/[-–]/).forEach((n,i)=>{const t=(pre+n+post).replace(/\s{2,}/g,' ').trim();if(i===0)full(t);else out.push(t)});
      return;
    }
    if(/^[\d۰-۹]+$/.test(sg)&&/[\d۰-۹]/.test(base)){out.push(base.replace(/[\d۰-۹]+(?=\D*$)/,sg));return}
    const w=sg.split(/\s+/);
    if(head&&w.length<=2&&!PL_VERB.has(w[0])&&!PL_NOUN.has(w[0])&&!PL_STOP.test(w[0])&&!/^[\d۰-۹]/.test(w[0])){out.push(head+' '+sg);return}
    full(sg);
  });
  return out;
}
function parsePlan(raw){
  raw=String(raw||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\r/g,'');
  const R={title:'',wd:'',iso:'',teams:[]};
  const dre=new RegExp('(\\d{1,2})\\s*('+MON.join('|')+')\\s*(\\d{4})');
  let cur=null;
  raw.split('\n').forEach(line=>{
    const l=line.trim();if(!l)return;
    const star=/^[*•●▪■◆🔹🔸✅☑✔]/u.test(l);
    const s=l.replace(/^[^\p{L}\p{N}]+/u,'');if(!s)return;
    const ci=s.search(/[:：]/);
    const isTeam=ci>0&&(star||/^(اکیپ|گروه|تیم|واحد|بخش)/.test(s));
    if(isTeam){
      cur={n:s.slice(0,ci).trim(),segs:[]};R.teams.push(cur);
      cur.segs.push(...splitPlanTasks(s.slice(ci+1)));
    }else if(cur){
      cur.segs.push(...splitPlanTasks(s));
    }else{
      if(!R.title&&/برنامه|مورخه|مورخ/.test(s))R.title=s;
      const m=norm(s).match(dre);
      if(m&&!R.iso){const g=j2g(+m[3],MON.indexOf(m[2])+1,+m[1]);R.iso=g[0]+'-'+pad(g[1])+'-'+pad(g[2])}
      const w=s.match(WDR);if(w&&!R.wd)R.wd=w[1];
    }
  });
  R.teams.forEach(tm=>{tm.items=planItems(tm.segs).map(t=>({t,d:false}));delete tm.segs});
  return R;
}
function savePlan(raw,id){

    for(const k in old){const c=k.indexOf('|'),tn=k.slice(0,c),ot=k.slice(c+1);if(tn===tm.n&&/^\d+$/.test(ot)&&i.t.endsWith(' '+ot)){i.d=true;delete old[k];break}}
  }));
  if(p)Object.assign(p,{raw,title:n.title,wd:n.wd,iso:n.iso,teams:n.teams});
  else{p={id:'pl'+Date.now()+Math.random().toString(36).slice(2,6),raw,title:n.title,wd:n.wd,iso:n.iso,teams:n.teams};S.plans.push(p)}
  save();PL.sel=p.id;return p;
}

function pnTok(x){
  return String(x||'').replace(/[\u200c\u200d]/g,' ').replace(/ي/g,'ی').replace(/ك/g,'ک').split('').map(c=>c).join('')
    .replace(/[^\p{L}\p{N}\s]/gu,' ').trim().split(/\s+/).map(w=>norm(w)).filter(Boolean);
}
const PL_IGN=/^کار(ها|های)?\s*(ارجایی|ارجاعی|ارجاع)$/;
function pnSim(a,b){
  if(a.key===b.key)return true;
  const na=a.t.filter(w=>/^\d+$/.test(w)).join(','),nb=b.t.filter(w=>/^\d+$/.test(w)).join(',');
  if(na!==nb)return false;
  const A=new Set(a.t),B=new Set(b.t);
  if(A.size<3||B.size<3)return false;
  let c=0;A.forEach(w=>{if(B.has(w))c++});
  return c/(A.size+B.size-c)>=0.7;
}
function pnInfo(x){const t=pnTok(x);return{t,key:t.join(' ')}}
/* کارهای تکراری نسبت به روزهای قبل: {"ti:ii":{pl:برنامه قبلی,it:کار قبلی}} */
function planDup(p){
  const res={};
  const prev=S.plans.filter(q=>q.id!==p.id&&(q.iso||'')<(p.iso||'')).sort((a,b)=>b.iso.localeCompare(a.iso));
  if(!prev.length)return res;
  const pre=prev.map(q=>({q,items:q.teams.flatMap(tm=>tm.items.map(it=>({it,i:pnInfo(it.t)})))}));
  p.teams.forEach((tm,ti)=>tm.items.forEach((it,ii)=>{
    const a=pnInfo(it.t);
    if(PL_IGN.test(a.key)||!a.key)return;
    for(const g of pre){
      const m=g.items.find(z=>!PL_IGN.test(z.i.key)&&pnSim(a,z.i));
      if(m){res[ti+':'+ii]={pl:g.q,it:m.it};break}
    }
  }));
  return res;
}
/* دسته‌بندی خودکار: هفته‌ی جاری = روزها · ۴ هفته‌ی قبل = دسته‌ی هفته · قدیمی‌تر = دسته‌ی ماه */

  const age=k=>Math.round((pdate(cur)-pdate(k))/864e5/7);
  let h=`<div class="wkh2"><span>${pWeekLbl(cur)}</span>${sum(wk[cur]||[])}</div>`+strip(cur);
  keys.filter(k=>age(k)>=1&&age(k)<=4).forEach(k=>{h+=grp('w'+k,pWeekLbl(k),wk[k],strip(k))});
  const mo={};
  keys.filter(k=>age(k)>=5).forEach(k=>{const j=iso2j(k),mk=j[0]+'-'+pad(j[1]);(mo[mk]=mo[mk]||{y:j[0],m:j[1],w:[]}).w.push(k)});
  Object.keys(mo).sort().reverse().forEach(mk=>{
    const M=mo[mk],wks=M.w.sort().reverse(),all=[].concat(...wks.map(k=>wk[k]));
    const inner=(wks.length===1?strip(wks[0]):wks.map(k=>grp('w'+k+'@'+mk,pWeekLbl(k),wk[k],strip(k))).join(''));
    h+=grp('m'+mk,MON[M.m-1]+' ماه '+fa(M.y),all,inner);
  });
  return h;
}

/* Event delegation for tasks */
document.addEventListener('click',e=>{

  if(g){const[v,st]=g.dataset.go.split(':');TF.ty='all';TF.pr='all';go(v,st);return}
  const n=e.target.closest('[data-nt]');
  if(n){
    if(n.dataset.nt==='ics'){
      const L=S.tasks.filter(t=>t.status!=='done'&&t.due);
      if(!L.length){toast('کار بازی با مهلت ثبت نشده');return}
      dl('contract-tasks.ics','text/calendar;charset=utf-8',makeICS(L));
      toast('فایل را باز کنید و به تقویم گوشی اضافه کنید');
      return;
    }
    if(n.dataset.nt==='perm'){
      // در APK/WebView معمولاً Notification نیست — از هشدار داخل اپ + تقویم استفاده می‌شود
      if(!('Notification' in window) || typeof Notification.requestPermission!=='function'){
        toast('در نسخه اپ، هشدار داخل برنامه فعال است. برای آلارم واقعی از «افزودن به تقویم گوشی» استفاده کنید.');
        notifyNow();
        return;
      }
      if(Notification.permission==='granted'){toast('اعلان‌ها فعال است');notifyNow();return}
      Notification.requestPermission().then(function(p){
        if(p==='granted'){toast('اعلان مهلت‌ها فعال شد');notifyNow();if(cur==='home')renderHome()}
        else toast('اجازه اعلان داده نشد — از خروجی تقویم استفاده کنید');
      });

    }
  }
  const k=e.target.closest('[data-tk]');

    const t=S.tasks.find(x=>x.id===k.dataset.id);if(!t)return;
    const a=k.dataset.tk;
    if(a==='done'){t.status='done';t.doneAt=today();save();VW[cur][1]();toast('انجام شد ✓')}
    else if(a==='start'){t.status='doing';save();VW[cur][1]();toast('وضعیت: در حال انجام')}
    else if(a==='pin'){const pinned=S.tasks.filter(x=>x.pin&&x.id!==t.id);if(!t.pin&&pinned.length>=5){toast('حداکثر ۵ کار می‌توانید پین کنید');return}t.pin=!t.pin;save();VW[cur][1]();toast(t.pin?'پین شد':'پین برداشته شد')}

    else if(a==='edit')taskForm(t.id);
    else if(a==='del'){if(confirm('حذف شود؟')){S.tasks=S.tasks.filter(x=>x.id!==t.id);save();VW[cur][1]()}}
    else if(a==='ics'){if(!t.due){toast('مهلت ثبت نشده');return}dl('task.ics','text/calendar;charset=utf-8',makeICS([t]));toast('فایل تقویم دانلود شد')}
    else if(a==='sms'){const p=S.list.find(x=>x.id===t.who);if(p&&p.mobile){const body='با سلام و احترام\nیادآوری: «'+t.title+'»'+(t.due?' — تاریخ '+jf(t.due):'');openSms(p.mobile,body)}else toast('شماره همراه ندارد')}
  }
  const sms=e.target.closest('[data-sms]');
  if(sms){

    const href=sms.getAttribute('href')||'';
    if(/^sms(to)?:/i.test(href)){return}

    const p=S.list.find(x=>x.id===sms.dataset.sms);
    if(p&&p.mobile)openSms(p.mobile,'با سلام و احترام\n');
    else toast('شماره همراه ندارد');
  }
});

function makeICS(L){
  const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=L.filter(t=>t.due).map(t=>{
    const p=S.list.find(x=>x.id===t.who);
    // رویداد زمان‌دار ساعت ۹ صبح روز مهلت (نه تمام‌روز / نیمه‌شب)
    const day=t.due.replace(/-/g,'');
    const start=day+'T090000';
    const end=day+'T093000';
    const lead=Math.max(0, parseInt(t.lead,10)||0);
    const lines=[
      'BEGIN:VEVENT',
      'UID:'+t.id+'@peyman-contract',
      'DTSTAMP:'+stamp,
      'DTSTART:'+start,
      'DTEND:'+end,
      'SUMMARY:'+e('مهلت: '+t.title),
      'DESCRIPTION:'+e([(TT[t.type]||{}).n,p?'مسئول: '+p.name:'','هشدار از '+lead+' روز قبل',t.note].filter(Boolean).join('\n')),
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e('مهلت امروز (۹ صبح): '+t.title),'TRIGGER:PT0S','END:VALARM'
    ];
    if(lead>0){
      // همان ساعت ۹ صبح، lead روز قبل از مهلت
      lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e('یادآوری: '+lead+' روز تا مهلت «'+t.title+'»'),'TRIGGER:-P'+lead+'DT0H0M0S','END:VALARM');
    }
    lines.push('END:VEVENT');
    return lines.join('\r\n');
  });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Peyman-Contract//FA','CALSCALE:GREGORIAN','METHOD:PUBLISH'].concat(ev).concat(['END:VCALENDAR']).join('\r\n')+'\r\n';
}

function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200)}
const closeD=d=>{d.classList.add('out');setTimeout(()=>{d.close();d.classList.remove('out')},190)};
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('cancel',e=>{e.preventDefault();closeD(d)}));

/* ========== اعلان‌ها ========== */
function notifyNow(){
  const over=S.tasks.filter(t=>tstate(t)==='over');
  const soon=S.tasks.filter(t=>tstate(t)==='soon');
  if(!over.length&&!soon.length)return;
  let body='';
  if(over.length)body+=fa(over.length)+' کار از مهلت گذشته';
  if(soon.length)body+=(body?' و ':'')+fa(soon.length)+' کار نزدیک مهلت';
  body+=' است.';
  toast(body);
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    let last=null;try{last=localStorage.getItem('pb_notified')}catch(_){}
    if(last===today())return;
    const n=new Notification('پیگیری قرارداد آبرسانی ۱۲۰۶',{
      body:body+(over[0]?'\n• '+over[0].title:soon[0]?'\n• '+soon[0].title:''),
      dir:'rtl',
      lang:'fa'
    });
    n.onclick=()=>{window.focus();go('tasks','over');n.close()};
    try{localStorage.setItem('pb_notified',today())}catch(_){}
  }catch(_){}
}
setTimeout(notifyNow,1500);

go('home');
